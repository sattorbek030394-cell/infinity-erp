name: V1 checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: infinity
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d infinity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:synthetic-ci-only@localhost:5432/infinity
      INTEGRATION_DATABASE_URL: postgresql://postgres:synthetic-ci-only@localhost:5432/infinity
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run migrate 2>&1 | tee -a checks.log
      - run: npm test 2>&1 | tee -a checks.log
        env:
          INTEGRATION_DATABASE_URL: ""
      - run: npm run typecheck 2>&1 | tee -a checks.log
      - run: npm run build 2>&1 | tee -a checks.log
      - run: npm run test:integration 2>&1 | tee -a checks.log
      # Tekshiruv yiqilsa oxirgi satrlar annotatsiya bo'lib chiqadi: log
      # faylini yuklab olish imkoni bo'lmagan joyda ham xato ko'rinadi.
      - if: failure()
        run: |
          [ -f checks.log ] || exit 0
          tail -c 6000 checks.log | python3 -c "import sys
print('::error title=Tekshiruv yiqildi::' + sys.stdin.buffer.read()
  .decode('utf-8','replace').replace('%','%25')
  .replace('\r','%0D').replace('\n','%0A'))"
