name: V1 checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: infinity
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d infinity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:synthetic-ci-only@localhost:5432/infinity
      INTEGRATION_DATABASE_URL: postgresql://postgres:synthetic-ci-only@localhost:5432/infinity
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run migrate
      - run: npm test
        env:
          INTEGRATION_DATABASE_URL: ""
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:integration
